<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIFFE - Secours & Signalement</title>
    <style>
        :root {
            --purple-main: #6A0DAD;
            --purple-dark: #4A00E0;
            --orange-alert: #FF7F50;
            --bg-gradient: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: white; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; padding: 20px 15px; }
        .header { text-align: center; margin-top: 40px; }
        .logo-shield { font-size: 50px; margin-bottom: 10px; }
        .brand-title { font-size: 2.8rem; font-weight: 800; letter-spacing: 2px; }
        .slogan { font-size: 1.4rem; font-weight: 600; margin-top: 5px; }
        .sub-slogan { font-size: 0.95rem; opacity: 0.9; margin-top: 8px; font-weight: 300; }
        .actions { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; width: 100%; }
        .btn-card { display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.95); color: #333; padding: 18px 20px; border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 1.1rem; box-shadow: 0 8px 15px rgba(0,0,0,0.15); transition: transform 0.2s; }
        .btn-card:active { transform: scale(0.97); }
        .btn-card.danger { background: var(--orange-alert); color: white; }
        .icon { font-size: 1.8rem; }
        .footer { text-align: center; font-size: 0.85rem; opacity: 0.85; margin-bottom: 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-shield">🛡️</div>
        <h1 class="brand-title">VIFFE</h1>
        <h2 class="slogan">Brisons le Silence</h2>
        <p class="sub-slogan">Votre voix, protégée.<br>En toute confidentialité.</p>
    </div>

    <div class="actions">
        <a href="denoncer.html" class="btn-card">
            <span class="icon">📢</span>
            <span>JE DÉNONCE</span>
        </a>
        <a href="urgence.html" class="btn-card danger">
            <span class="icon">🚨</span>
            <span>JE SUIS EN DANGER</span>
        </a>
        <a href="aide.html" class="btn-card">
            <span class="icon">🎧</span>
            <span>J'AI BESOIN D'AIDE</span>
        </a>
    </div>

    <div class="footer">
        🔒 Tout est 100% anonyme et confidentiel<br>
        📍 Yaoundé • Cameroun
    </div>
</body>
</html>
