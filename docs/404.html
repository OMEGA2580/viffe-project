<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable | RECCORRES-VIFFE</title>
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <div class="site-bg-overlay" aria-hidden="true"></div>
  <main>
    <section class="section" style="min-height:80vh;display:grid;place-items:center;text-align:center">
      <div class="wrap">
        <div class="kicker">Erreur 404</div>
        <h1 style="font-size:clamp(4rem,15vw,8rem);margin:10px 0">Oups.</h1>
        <p class="lead" style="margin:0 auto 30px">La page que vous cherchez n'existe pas ou a été déplacée.</p>
        <a class="button primary" href="index.html">Retour à l'accueil <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <!-- Badge "Télécharger l'application" flottant -->
  <a href="../web-app/index.html" class="app-download-badge" aria-label="Télécharger l'application d'urgence">
    <span class="app-badge-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14z"/>
        <circle cx="12" cy="19" r="1"/>
      </svg>
    </span>
    <span class="app-badge-text">
      <span class="app-badge-title">Télécharger l'application</span>
      <span class="app-badge-subtitle">SOS · Signalement · Aide</span>
    </span>
    <span class="app-badge-close" onclick="event.preventDefault(); event.stopPropagation(); this.closest('.app-download-badge').style.display='none';" aria-label="Fermer">×</span>
  </a>

  <script src="js/animations.js"></script>

  <a href="dons.html" class="donate-float" aria-label="Faire un don">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    Faire un don
